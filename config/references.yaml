# Editorial baseline: principles the house style always starts from. Evidence from
# active references adjusts and annotates them; it never replaces editorial judgment.
house_style:
  principles:
    - "Open on the strongest visual and a concrete claim in the first two seconds; no throat-clearing."
    - "Show visual evidence for every claim immediately; the footage proves the line."
    - "Cut when the idea changes, not on a clock; hold strong footage, shorten weak footage."
    - "Keep product footage premium: stable, well-exposed, tight punch-ins and reframes for detail."
    - "High visual density without chaos: one clear subject per shot, one idea per line."
    - "Captions stay readable: short word groups, selective emphasis on the words that carry the idea."
    - "Progress curiosity: each line earns the next; set up a question and pay it off."
    - "Use pattern interrupts (angle change, overlay, scale change) when attention would otherwise sag."
    - "B-roll must mean something; never decorative filler."
    - "Deliver a real payoff, then stop; minimal filler, clean loopable ending."
    - "Original script and timeline every time; references are evidence, never templates."
  defaults:
    target_segment_seconds: 2.2
    min_segment_seconds: 1.2
    max_segment_seconds: 4.5
    max_words_per_caption: 4
