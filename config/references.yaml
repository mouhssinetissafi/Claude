# Style reference registry for the Tech Shorts house style.
#
# Nothing here is a ranking. Channels are *candidates*; their influence is decided
# by measured Shorts performance fetched with `python run.py --references refresh`
# (needs YOUTUBE_API_KEY) and re-evaluated whenever the stats go stale.
# Subscriber counts are never used as a signal.

version: 1

performance:
  recent_days: 28              # window for "recent" views and the 28-day estimate
  shorts_max_seconds: 180      # videos at or under this length count as Shorts
  sample_size: 20              # latest N uploads examined per channel
  min_shorts_sample: 5         # fewer recent Shorts than this = insufficient data (excluded)
  stale_after_days: 45         # stats older than this must be refreshed before they count
  strong:                      # ANY signal met = high influence
    views_28d: 5000000         # views on Shorts published in the last 28 days (public lower bound)
    viral_video_views: 1000000
    viral_videos_min: 3        # "several" recent Shorts over viral_video_views
    median_views: 500000       # very strong median across the latest sample
    outlier_ratio: 3.0         # a Short at >= 3x the creator's median is an outlier
    outlier_min_count: 2       # "repeated" outliers
    outlier_median_floor: 20000  # outliers only count when the baseline itself is not tiny
  medium:                      # ANY signal met = medium influence
    views_28d: 1000000
    viral_videos_min: 1
    median_views: 150000
    outlier_min_count: 1
  weights:
    high: 1.0
    medium: 0.5
    low: 0.0                   # excluded from the active profile
  provisional_weight_user_verified: 0.6   # used ONLY while no stats have ever been fetched
  max_active_references: 6     # better 5 excellent references than 20 mediocre ones
  video_top_outlier_ratio: 2.0 # within a channel, videos at >= 2x median are "top performers"

# role: style     -> may shape the fast-cut Shorts editing style (if performance justifies it)
# role: research  -> narrative/research reference; never shapes editing style unless its own
#                    Shorts performance is tier "high"
# trust: user_verified_strong -> the operator vouches for recent strong performance; gets a
#                                provisional weight until real stats exist, then stats decide
# trust: unverified           -> excluded until stats prove performance
