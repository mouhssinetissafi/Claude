[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-editor-pro"
version = "1.1.0"
description = "Automated YouTube Shorts: topic or raw footage -> script -> voice -> captions -> Remotion -> final.mp4"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.6.0",
  "jsonschema>=4.20",
  "PyYAML>=6.0",
  "scenedetect>=0.6.4",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "pillow>=10.0",
]

[project.optional-dependencies]
captions = ["faster-whisper>=1.0"]
upload = ["google-api-python-client>=2.100", "google-auth>=2.25", "google-auth-oauthlib>=1.2"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "types-jsonschema"]

[tool.setuptools.packages.find]
include = ["autoeditor*"]

[tool.ruff]
line-length = 160
target-version = "py311"
extend-exclude = ["remotion", "work", "output", "cache", "review", "inbox"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "BLE"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["autoeditor"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = false
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
exclude = ["remotion/", "work/", "output/", "cache/", "review/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
