name: Build Windows Studio Installer

# DIAGNOSTIC VERSION on branch claude/auto-editor-footage-only-8chriw only.
# Reproduces "Generate Edit stuck on Running" on the installed build from run 9
# (9 photos, manual script, free test mode) and dumps where it hangs.
# main keeps the real workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  generate-probe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download the installer built by run 9 (the version in use)
        uses: actions/download-artifact@v4
        with:
          name: Auto-Editor-PRO-Studio-Windows
          run-id: 35919504545
          github-token: ${{ github.token }}
          path: old-installer

      - name: Tools (Pillow, py-spy, Playwright driver) and 9 photos
        shell: powershell
        run: |
          python -m pip install --quiet pillow py-spy
          python diag/make_photos.py D:\photos 9
          New-Item -ItemType Directory -Force -Path e2e-runner | Out-Null
          Copy-Item diag/generate_e2e.cjs e2e-runner/
          Push-Location e2e-runner
          npm init -y | Out-Null
          npm i --no-audit --no-fund playwright-core@1.63.0
          if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
          Pop-Location
          py-spy --version

      - name: Install run 9 build silently
        shell: powershell
        run: |
          $setup = Get-ChildItem old-installer -Filter *.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S', '/D=D:\ae-old'
          $exe = Get-ChildItem 'D:\ae-old' -Filter 'Auto-Editor PRO Studio.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw "installed exe not found" }
          "installed: $($exe.FullName)"

      - name: Reproduce Generate Edit (9 photos, manual script, free test mode)
        shell: powershell
        run: |
          $exe = (Get-ChildItem 'D:\ae-old' -Filter 'Auto-Editor PRO Studio.exe' -Recurse | Select-Object -First 1).FullName
          node e2e-runner/generate_e2e.cjs probe "$exe" D:\photos 10
          if ($LASTEXITCODE -ne 0) { throw "probe could not run" }
