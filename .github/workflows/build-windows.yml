name: Build Windows Studio Installer

# DIAGNOSTIC VERSION on branch claude/auto-editor-footage-only-8chriw only.
# Builds the fixed installer, installs it, and verifies Generate Edit
# (9 photos, manual script, free test mode): stage progress, preview, Cancel.
# main keeps the real workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: remotion/package-lock.json

      - name: Build fixed installer with the real build script
        shell: powershell
        run: ./scripts/build_studio_windows.ps1 -SkipPrerequisiteInstall -SkipTests

      - name: Tools (Pillow, py-spy, Playwright driver) and 9 photos
        shell: powershell
        run: |
          python -m pip install --quiet pillow py-spy
          python diag/make_photos.py D:\photos 9
          New-Item -ItemType Directory -Force -Path e2e-runner | Out-Null
          Copy-Item diag/generate_e2e.cjs e2e-runner/
          Push-Location e2e-runner
          npm init -y | Out-Null
          npm i --no-audit --no-fund playwright-core@1.63.0
          if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
          Pop-Location

      - name: Install fixed build silently
        shell: powershell
        run: |
          Start-Process -Wait -FilePath (Resolve-Path release/Auto-Editor-PRO-Studio-Setup.exe) -ArgumentList '/S', '/D=D:\ae-new'
          $exe = Get-ChildItem 'D:\ae-new' -Filter 'Auto-Editor PRO Studio.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw "installed exe not found" }
          "installed: $($exe.FullName)"

      - name: Verify Generate Edit, stage progress and Cancel on the installed build
        shell: powershell
        run: |
          $exe = (Get-ChildItem 'D:\ae-new' -Filter 'Auto-Editor PRO Studio.exe' -Recurse | Select-Object -First 1).FullName
          node e2e-runner/generate_e2e.cjs verify "$exe" D:\photos 10
          if ($LASTEXITCODE -ne 0) { throw "Generate Edit verification failed" }
