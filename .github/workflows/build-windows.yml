name: Build Windows Studio Installer

# DIAGNOSTIC VERSION on branch claude/auto-editor-footage-only-8chriw only.
# Verifies a candidate fix for the engine ping check in
# scripts/build_studio_windows.ps1. main keeps the real workflow.
on:
  workflow_dispatch:

jobs:
  diagnose-ping:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bytes piped with Console InputEncoding = UTF-8 without BOM
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Console]::InputEncoding = New-Object System.Text.UTF8Encoding $false
          "Console InputEncoding now: $([Console]::InputEncoding.WebName) preamble bytes=$([Console]::InputEncoding.GetPreamble().Length)"
          '{"id":1,"method":"ping","params":{}}' | python diag/dump_stdin.py

      - name: Build engine exactly as the script does
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller
          python -m PyInstaller --noconfirm --clean packaging/autoeditor_engine.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }

      - name: The script's exact ping lines with the candidate fix
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path studio/resources/engine | Out-Null
          Copy-Item -Force dist/autoeditor-engine.exe studio/resources/engine/autoeditor-engine.exe
          [Console]::InputEncoding = New-Object System.Text.UTF8Encoding $false
          $ping = '{"id":1,"method":"ping","params":{}}' | & studio/resources/engine/autoeditor-engine.exe | Select-Object -First 1
          if (-not ($ping -match '"ok"\s*:\s*true')) { throw "Packaged engine failed its ping check: $ping" }
          "PING CHECK PASSED: $ping"
