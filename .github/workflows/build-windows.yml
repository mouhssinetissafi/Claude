name: Build Windows Studio Installer

# DIAGNOSTIC VERSION on branch claude/auto-editor-footage-only-8chriw only.
# Reproduces the engine ping check from scripts/build_studio_windows.ps1 and
# records the exact bytes involved. main keeps the real workflow.
on:
  workflow_dispatch:

jobs:
  diagnose-ping:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Encoding facts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          "PowerShell: $($PSVersionTable.PSVersion)"
          "OutputEncoding (default): $($OutputEncoding.WebName) preamble bytes=$($OutputEncoding.GetPreamble().Length)"
          "Console InputEncoding: $([Console]::InputEncoding.WebName)  OutputEncoding: $([Console]::OutputEncoding.WebName)"
          python -c "import locale; print('python preferred encoding:', locale.getpreferredencoding(False))"

      - name: Bytes PowerShell pipes into a program (default OutputEncoding)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          '{"id":1,"method":"ping","params":{}}' | python diag/dump_stdin.py

      - name: Bytes PowerShell pipes into a program (UTF-8 without BOM, as the script now sets)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $OutputEncoding = New-Object System.Text.UTF8Encoding $false
          '{"id":1,"method":"ping","params":{}}' | python diag/dump_stdin.py

      - name: Build engine exactly as the script does
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller
          python -m PyInstaller --noconfirm --clean packaging/autoeditor_engine.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }

      - name: Engine ping through PowerShell (every output line)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $OutputEncoding = New-Object System.Text.UTF8Encoding $false
          $lines = '{"id":1,"method":"ping","params":{}}' | & dist/autoeditor-engine.exe 2>&1
          $i = 0
          foreach ($line in $lines) { $i++; "line $i : $line" }
          "exit code: $LASTEXITCODE"

      - name: Engine ping with exact bytes (no PowerShell pipe)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          python diag/engine_probe.py dist/autoeditor-engine.exe
