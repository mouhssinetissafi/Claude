name: Build Windows Studio Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'autoeditor/**'
      - 'studio/**'
      - 'remotion/**'
      - 'packaging/**'
      - 'scripts/build_studio_windows.ps1'
      - 'studio_engine.py'
      - 'pyproject.toml'
      - 'config/**'
      - 'assets/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: remotion/package-lock.json

      - name: Build installer on Windows
        shell: powershell
        run: ./scripts/build_studio_windows.ps1 -SkipPrerequisiteInstall -SkipTests

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Auto-Editor-PRO-Studio-Windows
          path: release/Auto-Editor-PRO-Studio-Setup.exe
          if-no-files-found: error
